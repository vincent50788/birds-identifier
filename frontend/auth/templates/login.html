<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login - BirdTag</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body
    class="bg-[#0E1117] text-white min-h-screen flex items-center justify-center font-sans"
  >
    <div class="bg-[#1F2937] shadow-2xl rounded-2xl p-10 w-full max-w-md">
      <h2 class="text-3xl font-bold text-center text-purple-400 mb-6">
        Login to BirdTag
      </h2>

      {% if error %}
      <div class="bg-red-500 text-white px-4 py-3 rounded mb-4">
        {{ error }}
      </div>
      {% endif %} {% if message %}
      <div class="bg-green-500 text-white px-4 py-3 rounded mb-4">
        {{ message }}
      </div>
      {% endif %}

      <form method="POST" action="/login" class="space-y-6">
        <div>
          <label class="block text-sm font-medium">Email</label>
          <input
            type="email"
            name="email"
            class="w-full px-4 py-2 rounded-md border border-gray-600 bg-[#111827] text-white focus:ring-purple-500 focus:border-purple-500"
            placeholder="you@example.com"
            required
          />
        </div>
        <div>
          <label class="block text-sm font-medium">Password</label>
          <input
            type="password"
            name="password"
            class="w-full px-4 py-2 rounded-md border border-gray-600 bg-[#111827] text-white focus:ring-purple-500 focus:border-purple-500"
            placeholder="••••••••"
            required
          />
        </div>
        <div>
          <button
            type="submit"
            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 rounded-md transition duration-300 shadow-md"
          >
            Login
          </button>
        </div>
      </form>

      <p class="mt-6 text-center text-sm text-gray-400">
        Don’t have an account?
        <a href="/signup" class="text-cyan-400 hover:text-cyan-300 font-medium"
          >Sign up</a
        >
      </p>
    </div>
  </body>
</html>
